<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Island</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Cor tirada da capa do álbum. Alimenta o halo e os detalhes. */
      --glow: 150 150 160;
      /* Curvas de movimento: a primeira é a do iOS, a segunda tem um leve repique. */
      --ease: cubic-bezier(.32, .72, 0, 1);
      --spring: cubic-bezier(.3, 1.22, .36, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      color: #fff;
      font-family: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

    /* Faixa invisível na borda de cima, no mesmo lugar em que a barra de tarefas espera o mouse. */
    #borda {
      position: absolute;
      top: 0;
      left: 50%;
      width: 240px;
      height: 10px;
      transform: translateX(-50%);
    }

    /* O palco é invisível. Só as cápsulas pretas recebem o mouse. */
    #cluster {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      display: flex;
      align-items: flex-start;
      pointer-events: none;
      transition: transform .78s var(--spring);
    }

    /* Recolhida: sobra só um fio de 2px, como a barra de tarefas escondida. */
    #cluster.away {
      transform: translateX(-50%) translateY(calc(-100% + 2px));
      transition: transform .5s var(--ease);
    }

    #cluster:not(.away) #detached { display: none; }

    .pager {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      z-index: 6;
      display: flex;
      justify-content: center;
      gap: 6px;
    }
    #cluster.away .pager,
    #cluster.away .blob-pager-footer { display: none; }
    .pager button {
      width: 6px;
      height: 6px;
      padding: 0;
      border-radius: 99px;
      background: rgba(255,255,255,.28);
      transition: width .35s var(--spring), background .2s ease;
    }
    .pager button.on { width: 16px; background: #c4b5fd; }

    .blob {
      position: relative;
      flex: none;
      overflow: hidden;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      background: #000;
      /* Halo colorido da capa + sombra de profundidade. */
      box-shadow:
        0 0 22px -4px rgb(var(--glow) / .5),
        0 18px 40px -12px rgb(var(--glow) / .32),
        0 16px 36px rgba(0,0,0,.44);
      transition:
        width .58s var(--spring),
        height .58s var(--spring),
        border-radius .5s var(--ease),
        margin .58s var(--spring),
        box-shadow .5s ease,
        opacity .3s ease;
      will-change: width, height;
    }

    /* Recolhida não deixa o halo vazar para a tela. */
    #cluster.away .blob { box-shadow: none; }

    /* Fio de luz no topo: dá o acabamento de vidro. */
    .blob::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 38%),
        radial-gradient(120% 80% at 50% -30%, rgb(var(--glow) / .22), transparent 70%);
      box-shadow:
        inset 0 .5px 0 rgba(255,255,255,.22),
        inset 0 0 0 .5px rgba(255,255,255,.1);
    }

    /* Squish: a cápsula amassa de leve ao trocar de forma, como no iPhone. */
    @keyframes squish {
      0%   { transform: scale(1, 1); }
      26%  { transform: scale(1.016, .962); }
      58%  { transform: scale(.994, 1.014); }
      100% { transform: scale(1, 1); }
    }
    .blob.morph { animation: squish .6s var(--ease); }

    /* Repouso: cápsula curta, só com a hora. */
    .blob.rest { width: 116px; height: 37px; border-radius: 19px; }

    /* Compacta: uma atividade, conteúdo colado, sem espaço sobrando. */
    .blob.music-compact { width: 98px; height: 37px; border-radius: 19px; }
    .blob.timer-compact { width: 124px; height: 37px; border-radius: 19px; }
    .blob.charge { width: 108px; height: 37px; border-radius: 19px; }

    /* Mínima: duas atividades. A música vira um círculo; o timer fica ao lado. */
    .blob.minimal { width: 37px; height: 37px; border-radius: 19px; }
    #detached {
      width: 0;
      height: 37px;
      margin-left: 0;
      opacity: 0;
      border-radius: 19px;
      pointer-events: none;
      box-shadow: none;
    }
    #cluster.minimal #detached {
      width: 80px;
      margin-left: 8px;
      opacity: 1;
      pointer-events: auto;
    }
    #cluster.minimal.away #detached { box-shadow: none; }

    /* Expandida: toque longo no iPhone vira um clique aqui. */
    .blob.expanded-music,
    .blob.power,
    .blob.expanded-timer,
    .blob.expanded-status {
      background: linear-gradient(145deg, rgba(30,31,42,.96), rgba(13,14,20,.98));
    }
    .blob.expanded-music  {
      width: 440px;
      height: 226px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .blob.expanded-music.has-music-art::before {
      opacity: .28;
    }
    .blob.expanded-music.has-music-art {
      background: rgba(5, 5, 8, .32) !important;
      box-shadow:
        0 0 40px -8px rgb(var(--glow) / .55),
        0 20px 50px -12px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);
    }
    .music-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .55s var(--ease);
    }
    .blob.has-music-art.expanded-music .music-ambient,
    .blob.expanded-music.is-music-live .music-ambient,
    .blob.has-music-art.music-compact .music-ambient {
      opacity: 1;
    }
    .music-ambient-bg {
      position: absolute;
      inset: -50%;
      background: center/cover no-repeat;
      filter: blur(46px) saturate(1.65) brightness(.8);
      transform: scale(1.14);
      transition: background-image .65s ease, transform .65s var(--ease);
    }
    .music-ambient-canvas {
      position: absolute;
      inset: -8%;
      background: center/cover no-repeat;
      opacity: 0;
      filter: blur(10px) saturate(1.4);
      transform: scale(1.08);
      transition: background-image .65s ease, opacity .5s ease;
    }
    .blob.has-music-art.expanded-music .music-ambient-canvas {
      opacity: .48;
    }
    .blob.expanded-music.is-music-live:not(.has-music-art) .music-ambient-bg {
      inset: 0;
      transform: none;
      filter: none;
      background:
        radial-gradient(ellipse 110% 90% at 18% -10%, rgb(var(--glow) / .55), transparent 58%),
        radial-gradient(ellipse 80% 70% at 92% 95%, rgb(var(--glow) / .38), transparent 52%),
        linear-gradient(160deg, #14141c, #060608);
    }
    .blob.is-playing .music-ambient-bg {
      animation: ambientDrift 14s ease-in-out infinite;
    }
    @keyframes ambientDrift {
      0%, 100% { transform: scale(1.12) translate(0, 0); }
      50% { transform: scale(1.2) translate(-1.5%, 1%); }
    }
    .music-ambient-tint {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 80% at 12% 20%, rgb(var(--glow) / .55), transparent 58%),
        radial-gradient(ellipse 70% 70% at 88% 78%, rgb(var(--glow) / .32), transparent 52%);
      mix-blend-mode: screen;
      opacity: .7;
      transition: opacity .4s ease;
    }
    .blob.is-playing .music-ambient-tint {
      animation: ambientPulse 2.4s ease-in-out infinite;
    }
    @keyframes ambientPulse {
      0%, 100% { opacity: .5; }
      50% { opacity: .92; }
    }
    .music-ambient-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,.06) 0%,
        rgba(0,0,0,.22) 38%,
        rgba(0,0,0,.78) 100%
      );
    }
    /* Páginas expandidas: conteúdo em cima, pager no rodapé (sem sobrepor a barra). */
    .blob.expanded-music,
    .blob.power,
    .blob.expanded-timer,
    .blob.expanded-status {
      display: flex;
      flex-direction: column;
    }
    .blob-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
    }
    .blob-pager-footer {
      flex: 0 0 26px;
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 7;
      pointer-events: none;
    }
    .blob-pager-footer .pager {
      position: static;
      bottom: auto;
      left: auto;
      right: auto;
      pointer-events: auto;
    }
    .blob.expanded-music .blob-pager-footer,
    .blob.power .blob-pager-footer,
    .blob.expanded-timer .blob-pager-footer,
    .blob.expanded-status .blob-pager-footer {
      display: flex;
    }
    .blob.expanded-music .blob-pager-footer {
      flex: 0 0 32px;
    }
    .blob.power           { width: 300px; height: 128px; border-radius: 28px; }
    .blob.expanded-timer  { width: 392px; height: 178px; border-radius: 28px; }
    .blob.expanded-status { width: 280px; height: 128px; border-radius: 28px; }
    .blob.alert-banner { width: 344px; height: 90px; border-radius: 42px; }
    .blob.alert-inline { width: 200px; height: 37px; border-radius: 19px; }

    /* Trocas de conteúdo: entra crescendo e saindo do desfoque. */
    .face {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transform: scale(.9);
      filter: blur(7px);
      pointer-events: none;
      transition:
        opacity .24s ease,
        transform .46s var(--spring),
        filter .26s ease;
    }
    .face.on {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      pointer-events: auto;
    }

    .face[data-face="rest"],
    .face[data-face="music-min"],
    .face[data-face="timer-min"] {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rest-time, .min-time, .compact-time {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      text-shadow: 0 1px 10px rgba(0,0,0,.5);
    }
    .rest-time { font-size: 15px; }
    .min-time, .compact-time { font-size: 14px; }

    .row {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 13px 4px 4px;
    }
    .row.timer { padding-left: 11px; gap: 9px; }

    /* Capa do álbum */
    .art {
      flex: none;
      position: relative;
      background: #18181b center/cover no-repeat;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.9);
      box-shadow:
        inset 0 0 0 .5px rgba(255,255,255,.16),
        0 4px 14px -2px rgba(0,0,0,.6);
      transition: transform .5s var(--spring);
    }
    .art.has-art .fallback { display: none; }
    .art-sm, .art-fill { width: 29px; height: 29px; border-radius: 50%; }
    .art-lg {
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background-image: linear-gradient(135deg, #e879f9, #8b5cf6 55%, #4f46e5);
      box-shadow:
        inset 0 0 0 .5px rgba(255,255,255,.16),
        0 8px 18px -6px rgba(139,92,246,.55);
    }
    /* Faixa nova: a capa dá um pulsinho. */
    @keyframes artPop {
      0%   { transform: scale(.82); }
      55%  { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .art.pop { animation: artPop .62s var(--ease); }
    #ilha.track-leafing .art.pop { animation: none; }

    /* Equalizador com as cores da capa */
    .eq { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; margin-left: auto; }
    .eq span {
      width: 2.5px;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(180deg, #fff, rgb(var(--glow)));
      transform-origin: center bottom;
      animation: eq 1.05s ease-in-out infinite;
      box-shadow: 0 0 7px rgb(var(--glow) / .85);
    }
    .eq span:nth-child(2) { animation-delay: .12s; }
    .eq span:nth-child(3) { animation-delay: .28s; }
    .eq span:nth-child(4) { animation-delay: .4s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(.26); }
      50%      { transform: scaleY(1); }
    }
    .eq.paused span {
      animation: none;
      transform: scaleY(.3);
      opacity: .4;
      box-shadow: none;
    }

    /* Luz de carga: esfera acesa. A face inteira some quando não está carregando. */
    .charge-row {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px 0 6px;
    }
    .charge-orb {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #04210c;
      background: radial-gradient(circle at 38% 32%, #eafff0 0%, #7dffab 28%, #30d158 62%, #0c8a38 100%);
      box-shadow: 0 0 0 3px rgba(48,209,88,.18), 0 0 14px rgba(48,209,88,.95);
      animation: orb 1.6s ease-in-out infinite;
    }
    .charge-orb svg { width: 12px; height: 12px; }
    @keyframes orb {
      0%, 100% { box-shadow: 0 0 0 3px rgba(48,209,88,.16), 0 0 10px rgba(48,209,88,.7); }
      50% { box-shadow: 0 0 0 5px rgba(48,209,88,.28), 0 0 18px rgba(48,209,88,1); }
    }
    .charge-pct {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: #7dffab;
      text-shadow: 0 0 10px rgba(48,209,88,.65);
    }
    .live-bolt {
      margin-left: auto;
      color: #30d158;
      filter: drop-shadow(0 0 6px rgba(48,209,88,.9));
      display: flex;
    }
    .live-bolt[hidden] { display: none; }

    /* Anel do timer, igual ao do iOS */
    .ring { display: block; transform: rotate(-90deg); overflow: visible; }
    .ring circle { fill: none; stroke-linecap: round; }
    .ring .bg { stroke: rgba(255,255,255,.16); }
    .ring .fill {
      stroke: #ff9f0a;
      filter: drop-shadow(0 0 5px rgba(255,159,10,.75));
      transition: stroke-dashoffset .95s linear;
    }
    .ring-sm { width: 17px; height: 17px; }
    .ring-sm circle { stroke-width: 3; }
    .ring-lg { width: 52px; height: 52px; }
    .ring-lg circle { stroke-width: 3.4; }

    /* ── Música expandida (fundo vivo + dock de controles) ── */
    .face[data-face="expanded-music"] {
      padding: 12px 18px 4px;
      display: flex;
      flex-direction: column;
      z-index: 2;
      overflow: visible;
    }
    .music-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      gap: 6px;
    }
    .music-stage .transport-row,
    .music-stage .scrub-dock {
      flex-shrink: 0;
    }
    .music-hero-glance {
      position: absolute;
      right: -18px;
      top: -6px;
      width: 132px;
      height: 132px;
      border-radius: 20px;
      background: center/cover no-repeat;
      opacity: 0;
      transform: rotate(7deg);
      pointer-events: none;
      z-index: 0;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      -webkit-mask-image: linear-gradient(115deg, transparent 8%, #000 52%);
              mask-image: linear-gradient(115deg, transparent 8%, #000 52%);
      transition: opacity .55s ease, background-image .65s ease;
    }
    .blob.has-music-art.expanded-music .music-hero-glance {
      opacity: .62;
    }
    .music-now {
      position: relative;
      z-index: 1;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,.52);
      text-shadow: 0 1px 10px rgba(0,0,0,.55);
    }
    .music-meta-wrap {
      position: relative;
      z-index: 1;
      perspective: 720px;
      perspective-origin: 28% center;
      min-height: 56px;
      overflow: hidden;
      border-radius: 14px;
    }
    .music-meta-wrap.leaf-active::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        100deg,
        rgba(0,0,0,.62) 0%,
        rgba(0,0,0,.22) 42%,
        transparent 68%
      );
      opacity: 0;
      animation: leafShade .72s var(--ease) both;
    }
    .music-meta-wrap.leaf-active.leaf-back::before {
      background: linear-gradient(
        260deg,
        rgba(0,0,0,.62) 0%,
        rgba(0,0,0,.22) 42%,
        transparent 68%
      );
    }
    @keyframes leafShade {
      0%, 100% { opacity: 0; }
      28%, 58% { opacity: 1; }
    }
    .music-meta {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 14px;
      align-items: center;
      min-width: 0;
      padding-right: 64px;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition:
        transform .62s var(--ease),
        opacity .48s ease,
        filter .48s ease,
        box-shadow .5s ease;
      will-change: transform, opacity;
    }
    .music-meta.leaf-out.leaf-fwd {
      transform: rotateY(-92deg) translateX(-10px) scale(.9);
      opacity: 0.06;
      filter: blur(3px) brightness(.72);
      transform-origin: left center;
      box-shadow: -16px 6px 32px rgba(0,0,0,.5);
    }
    .music-meta.leaf-out.leaf-back {
      transform: rotateY(92deg) translateX(10px) scale(.9);
      opacity: 0.06;
      filter: blur(3px) brightness(.72);
      transform-origin: right center;
      box-shadow: 16px 6px 32px rgba(0,0,0,.5);
    }
    .music-meta.leaf-in.leaf-fwd {
      transform: rotateY(86deg) translateX(14px) scale(.9);
      opacity: 0;
      filter: blur(4px);
      transform-origin: right center;
      box-shadow: 12px 4px 24px rgba(0,0,0,.35);
    }
    .music-meta.leaf-in.leaf-fwd.leaf-run {
      transform: rotateY(0deg) translateX(0) scale(1);
      opacity: 1;
      filter: blur(0) brightness(1);
      box-shadow: none;
    }
    .music-meta.leaf-in.leaf-back {
      transform: rotateY(-86deg) translateX(-14px) scale(.9);
      opacity: 0;
      filter: blur(4px);
      transform-origin: left center;
      box-shadow: -12px 4px 24px rgba(0,0,0,.35);
    }
    .music-meta.leaf-in.leaf-back.leaf-run {
      transform: rotateY(0deg) translateX(0) scale(1);
      opacity: 1;
      filter: blur(0) brightness(1);
      box-shadow: none;
    }
    .music-hero-glance.leaf-glance {
      animation: glanceLeaf .72s var(--ease) both;
    }
    @keyframes glanceLeaf {
      0%   { opacity: .62; transform: rotate(7deg) scale(1); }
      38%  { opacity: .04; transform: rotate(0deg) scale(.86) translateX(-18%); }
      100% { opacity: .62; transform: rotate(7deg) scale(1); }
    }
    #ilha.track-leafing .music-ambient-bg,
    #ilha.track-leafing .music-ambient-canvas {
      transition-duration: .75s;
      filter: blur(46px) saturate(1.65) brightness(.72);
    }
    #ilha.track-leafing.is-playing .music-ambient-bg {
      animation: ambientDrift 14s ease-in-out infinite, leafAmbient .72s var(--ease);
    }
    @keyframes leafAmbient {
      0%, 100% { transform: scale(1.14); }
      45% { transform: scale(1.22) translateX(-2%); }
    }
    .music-copy { min-width: 0; flex: 1; }
    .art-xl {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      box-shadow:
        inset 0 0 0 .5px rgba(255,255,255,.2),
        0 10px 28px -8px rgba(0,0,0,.65);
    }
    .transport-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 2px;
    }
    .transport-row .ctrl.play {
      width: 44px;
      height: 44px;
    }
    .transport-row .ctrl.play svg { width: 16px; height: 16px; }
    .scrub-dock {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding-top: 4px;
    }
    .blob.expanded-music .scrub-dock {
      padding-bottom: 12px;
      margin-bottom: 2px;
    }
    .blob.expanded-music .bar {
      --bar-hit: 22px;
      overflow: visible;
    }

    .face[data-face="expanded-music"] .title {
      font-size: 16px;
      text-shadow: 0 1px 12px rgba(0,0,0,.45);
    }
    .face[data-face="expanded-music"] .artist {
      font-size: 13px;
      color: rgba(255,255,255,.62);
      text-shadow: 0 1px 8px rgba(0,0,0,.4);
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 86%, transparent 100%);
              mask-image: linear-gradient(90deg, #000 0, #000 86%, transparent 100%);
    }
    .title span { display: inline-block; will-change: transform; }
    /* Título comprido anda sozinho e volta, sem cortar o nome. */
    .title.roll span { animation: roll 11s var(--ease) infinite; }
    @keyframes roll {
      0%, 14%   { transform: translateX(0); }
      50%, 64%  { transform: translateX(var(--shift, 0)); }
      97%, 100% { transform: translateX(0); }
    }
    .artist {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scrub { display: flex; flex-direction: column; gap: 8px; }
    .bar {
      position: relative;
      --bar-hit: 18px;
      height: var(--bar-hit);
      cursor: pointer;
      touch-action: none;
    }
    .bar-rail {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      border-radius: 99px;
      background: rgba(255,255,255,.1);
      overflow: hidden;
    }
    .bar.seeking {
      cursor: grabbing;
    }
    .bar.seeking .bar-fill,
    .bar.is-playing .bar-fill {
      transition: none;
    }
    .bar-fill {
      position: relative;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, rgb(var(--glow) / .75), rgba(255,255,255,.95));
      box-shadow: 0 0 12px rgb(var(--glow) / .65);
      transition: width .28s linear;
    }
    .bar-thumb {
      position: absolute;
      top: 50%;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%) scale(.82);
      box-shadow:
        0 0 0 0 rgb(var(--glow) / .45),
        0 0 10px rgb(var(--glow) / .75);
      transition:
        left .28s linear,
        transform .42s var(--spring),
        box-shadow .35s ease;
      pointer-events: none;
      will-change: left, transform;
    }
    .bar.is-playing:not(.seeking) .bar-thumb {
      animation: thumbBreath 2.4s ease-in-out infinite;
      transition: transform .42s var(--spring), box-shadow .35s ease;
    }
    @keyframes thumbBreath {
      0%, 100% {
        transform: translate(-50%, -50%) scale(.88);
        box-shadow:
          0 0 0 0 rgb(var(--glow) / .35),
          0 0 10px rgb(var(--glow) / .65);
      }
      50% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow:
          0 0 0 4px rgb(var(--glow) / .22),
          0 0 14px rgba(255,255,255,.9);
      }
    }
    .bar.seeking .bar-thumb {
      animation: none;
      transform: translate(-50%, -50%) scale(1.18);
      box-shadow:
        0 0 0 5px rgb(var(--glow) / .3),
        0 0 18px rgba(255,255,255,1);
      transition: left 0s linear, transform .22s var(--spring), box-shadow .22s ease;
    }
    .bar:not(.is-playing) .bar-thumb {
      transform: translate(-50%, -50%) scale(.78);
      opacity: .88;
    }
    .scrub-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,.35);
      font-variant-numeric: tabular-nums;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: none;
    }
    button.ctrl {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.65);
      transition: background .2s ease, color .2s ease, transform .3s var(--spring);
    }
    button.ctrl svg { width: 16px; height: 16px; }
    #btn-play .ico { display: none; }
    #btn-play .ico.on { display: block; }
    button.ctrl:hover { background: rgba(255,255,255,.1); color: #fff; }
    button.ctrl:active { transform: scale(.92); }
    button.ctrl.play {
      width: 36px;
      height: 36px;
      background: #fff;
      color: #000;
    }
    button.ctrl.play svg { width: 14px; height: 14px; }
    button.ctrl.play:hover { background: #fff; color: #000; transform: scale(1.05); }

    /* ── Timer expandido ──────────────────────────── */
    .face[data-face="expanded-timer"] {
      padding: 12px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }
    .timer-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .timer-copy { flex: 1; min-width: 0; }
    .kicker {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.45);
    }
    .detail {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255,255,255,.35);
    }
    .timer-big {
      margin-top: 2px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .actions { margin-top: auto; display: flex; gap: 6px; align-items: center; }
    .timer-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }
    .timer-presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .timer-controls {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 8px;
    }
    .blob.expanded-timer {
      box-shadow:
        0 24px 80px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(167,139,250,.22);
    }

    .pill {
      height: 31px;
      padding: 0 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      box-shadow: inset 0 0 0 .5px rgba(255,255,255,.1);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      transition: background .2s ease, transform .3s var(--spring);
    }
    .pill:hover { background: rgba(255,255,255,.22); }
    .pill:active { transform: scale(.95); }
    .pill:disabled { opacity: .38; cursor: default; pointer-events: none; }
    .pill.danger { background: rgba(255,69,58,.18); color: #ff6b61; }
    .pill.danger:hover { background: rgba(255,69,58,.3); }

    /* ── Relógio expandido ────────────────────────── */
    .face[data-face="expanded-status"],
    .face[data-face="power"] {
      padding: 18px 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .clock-big {
      margin-top: 4px;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .date-line {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,.35);
    }

    /* Bandeja embutida: separa bateria e atalhos do bloco do relógio. */
    .tray {
      margin-top: auto;
      width: 100%;
      height: 42px;
      padding: 0 11px;
      border-radius: 21px;
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 0 0 .5px rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .no-battery .tray { justify-content: center; }

    /* Bateria desenhada, com o nível preenchido de verdade. */
    .battery {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(255,255,255,.8);
    }
    .batt-shell {
      position: relative;
      width: 26px;
      height: 13px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1.2px rgba(255,255,255,.4);
    }
    .batt-shell::after {
      content: '';
      position: absolute;
      top: 4px;
      right: -3.4px;
      width: 2.4px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background: rgba(255,255,255,.4);
    }
    .batt-level {
      position: absolute;
      top: 2.4px;
      left: 2.4px;
      height: 8.2px;
      width: 0;
      border-radius: 2px;
      background: #fff;
      transition: width .6s var(--ease), background .3s ease;
    }
    .battery.charging .batt-level { background: #30d158; box-shadow: 0 0 8px rgba(48,209,88,.8); }
    .battery.low .batt-level { background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.8); }
    .battery.charging { color: #30d158; }
    .battery.low { color: #ff6b61; }
    #battery-bolt {
      display: none;
      flex: none;
      filter: drop-shadow(0 0 5px rgba(48,209,88,.9));
    }
    #battery-bolt.on { display: block; }

    .chips { display: flex; gap: 6px; }
    .chip {
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      box-shadow: inset 0 0 0 .5px rgba(255,255,255,.1);
      color: rgba(255,255,255,.88);
      font-size: 12px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      transition: background .2s ease, color .2s ease, transform .3s var(--spring);
    }
    .chip:hover {
      background: rgba(139,92,246,.22);
      color: #ddd6fe;
      transform: translateY(-1px);
    }
    .chip:active { transform: scale(.93); }

    /* Timer Foco: sobrescreve .chip/.pill globais (evita quebra “5” / “min”). */
    .blob.expanded-timer .chip-txt {
      display: block;
      white-space: nowrap;
      line-height: 1;
    }
    .blob.expanded-timer .timer-presets .chip,
    .blob.expanded-timer .timer-controls .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      line-height: 1;
      height: 32px;
      min-height: 32px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blob.expanded-timer .timer-controls .pill { font-size: 11px; }
    .blob.expanded-timer .ring-lg {
      width: 46px;
      height: 46px;
      flex: none;
    }
    .blob.expanded-timer .pill-timer-main {
      background: rgba(255,255,255,.2);
      box-shadow:
        inset 0 0 0 .5px rgba(255,255,255,.14),
        0 0 20px rgba(255,159,10,.12);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .blob.expanded-timer .pill-timer-main:hover {
      background: rgba(255,255,255,.28);
    }
    .blob.expanded-timer .pill-timer-main.is-idle {
      background: rgba(48,209,88,.2);
      color: #b8f5c8;
      box-shadow:
        inset 0 0 0 .5px rgba(48,209,88,.35),
        0 0 18px rgba(48,209,88,.15);
    }
    .blob.expanded-timer .pill-timer-main.is-idle:hover {
      background: rgba(48,209,88,.32);
    }
    .blob.expanded-timer .pill-timer-reset {
      background: rgba(139,92,246,.16);
      color: #ddd6fe;
      box-shadow: inset 0 0 0 .5px rgba(167,139,250,.28);
    }
    .blob.expanded-timer .pill-timer-reset:hover {
      background: rgba(139,92,246,.28);
    }

    .power-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* ── Alertas ──────────────────────────────────── */
    .face[data-face="alert"] {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 18px;
    }
    .alert-glyph { position: relative; display: flex; flex: none; }
    .alert-glyph .g { display: none; }
    .kind-charge .g-charge { display: block; color: #30d158; filter: drop-shadow(0 0 7px rgba(48,209,88,.85)); }
    .kind-low    .g-low    { display: block; color: #ff453a; filter: drop-shadow(0 0 7px rgba(255,69,58,.8)); }
    .kind-timer  .g-timer  { display: block; color: #ff9f0a; filter: drop-shadow(0 0 7px rgba(255,159,10,.8)); }
    .kind-notif  .g-notif  { display: block; color: #fff; }

    /* O ícone do alerta respira enquanto o aviso está na tela. */
    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.12); opacity: .82; }
    }
    .kind-charge .alert-glyph,
    .kind-low .alert-glyph,
    .kind-timer .alert-glyph { animation: breathe 1.5s ease-in-out infinite; }

    .alert-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .blob.alert-inline .alert-copy { flex-direction: row; align-items: baseline; gap: 8px; }
    .alert-title {
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: rgba(255,255,255,.46);
    }
    .blob.alert-inline .alert-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: none;
      color: #fff;
    }
    .alert-sub {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blob.alert-inline .alert-sub {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,.58);
    }
  </style>
</head>
<body>
  <div id="borda"></div>
  <div id="cluster" class="away">
    <div id="ilha" class="blob rest">
      <div class="music-ambient" id="music-ambient" aria-hidden="true">
        <div class="music-ambient-bg" id="music-ambient-bg"></div>
        <div class="music-ambient-canvas" id="music-ambient-canvas"></div>
        <div class="music-ambient-tint"></div>
        <div class="music-ambient-veil"></div>
      </div>
      <div class="blob-shell">
      <div class="face on" data-face="rest">
        <span class="rest-time" id="clock">--:--</span>
      </div>

      <div class="face" data-face="music-compact">
        <div class="row">
          <div class="art art-sm" data-art>
            <svg class="fallback" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 17.5a2.5 2.5 0 1 1-2-2.45V6.8l10-2v9.25a2.5 2.5 0 1 1-2-2.45V7.2l-6 1.2v9.1z"/></svg>
          </div>
          <div class="eq" id="eq">
            <span></span><span></span><span></span><span></span>
          </div>
          <span class="live-bolt" id="music-bolt" hidden>
            <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M13 2 4.5 13.2h6.2L9.8 22 19.5 9.6h-6.2L13 2z"/></svg>
          </span>
        </div>
    </div>

      <div class="face" data-face="power">
        <div class="kicker" id="power-kicker">Energia</div>
        <div class="power-hero">
          <div>
            <div class="timer-big" id="power-pct">--%</div>
            <div class="detail" id="power-detail">—</div>
          </div>
          <div class="battery" id="battery-row">
            <div class="batt-shell"><div class="batt-level" id="batt-level"></div></div>
            <svg id="battery-bolt" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M13 2 4.5 13.2h6.2L9.8 22 19.5 9.6h-6.2L13 2z"/></svg>
            <span id="battery-label"></span>
          </div>
          <svg class="ring ring-lg" viewBox="0 0 44 44">
            <circle class="bg" cx="22" cy="22" r="19"/>

          </svg>
        </div>
      </div>

      <div class="face" data-face="charge">
        <div class="charge-row">
          <span class="charge-orb">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M13 2 4.5 13.2h6.2L9.8 22 19.5 9.6h-6.2L13 2z"/></svg>
          </span>
          <span class="charge-pct" id="charge-pct">--%</span>
        </div>
      </div>

      <div class="face" data-face="timer-compact">

          <svg class="ring ring-sm" viewBox="0 0 24 24">

            <circle class="fill" id="ring-sm" cx="12" cy="12" r="9.5"/>

          <span class="compact-time" id="timer-compact">0:00</span>

      </div>

      <div class="face" data-face="music-min">

          <svg class="fallback" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 17.5a2.5 2.5 0 1 1-2-2.45V6.8l10-2v9.25a2.5 2.5 0 1 1-2-2.45V7.2l-6 1.2v9.1z"/></svg>
        </div>
      </div>

      <div class="face" data-face="expanded-music">
        <div class="music-hero-glance" id="music-hero-glance" aria-hidden="true"></div>
        <div class="music-stage">
          <div class="music-now">Tocando agora</div>
          <div class="music-meta-wrap">
          <div class="music-meta" id="music-meta">
            <div class="art art-xl" data-art>
              <svg class="fallback" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 17.5a2.5 2.5 0 1 1-2-2.45V6.8l10-2v9.25a2.5 2.5 0 1 1-2-2.45V7.2l-6 1.2v9.1z"/></svg>
            </div>
            <div class="music-copy">
              <div class="title" id="title-box"><span id="song-title">Música</span></div>
              <div class="artist" id="song-artist"></div>
            </div>
          </div>
          </div>
          <div class="transport transport-row">
            <button class="ctrl" id="btn-prev" type="button" aria-label="Anterior">
              <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.5 6.5 8.5 12l6 5.5"/></svg>
            </button>
            <button class="ctrl play" id="btn-play" type="button" aria-label="Pausar">
              <svg class="ico ico-pause on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.2 4.8h3.6v14.4H6.2zm8 0h3.6v14.4h-3.6z"/></svg>
              <svg class="ico ico-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8.2 5.4v13.2c0 .7.8 1.1 1.4.7l9.4-6.6a.9.9 0 0 0 0-1.4L9.6 4.7c-.6-.4-1.4 0-1.4.7z"/></svg>
            </button>
            <button class="ctrl" id="btn-next" type="button" aria-label="Próxima">
              <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9.5 6.5 6 5.5-6 5.5"/></svg>
            </button>
          </div>
          <div class="scrub scrub-dock">

              <span id="time-now">0:00</span>
              <span id="time-left">0:00</span>
            </div>
            <div
              class="bar"
              id="progress-bar"
              role="slider"
              aria-label="Posição na faixa"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="bar-rail"><div class="bar-fill" id="progress"></div></div>
              <div class="bar-thumb" id="progress-thumb" aria-hidden="true"></div>
            </div>
        </div>
      </div>
    </div>

      <div class="face" data-face="expanded-timer">
        <div class="timer-head">
          <div class="timer-copy">

            <div class="detail" id="timer-state">Em andamento</div>
          </div>
          <svg class="ring ring-lg" viewBox="0 0 44 44">
            <circle class="bg" cx="22" cy="22" r="19"/>
            <circle class="fill" id="ring-lg" cx="22" cy="22" r="19"/>
          </svg>
        </div>
        <div class="timer-actions">
          <div class="timer-presets">
            <button class="chip" type="button" data-min="5"><span class="chip-txt">5&nbsp;min</span></button>
            <button class="chip" type="button" data-min="15"><span class="chip-txt">15&nbsp;min</span></button>
            <button class="chip" type="button" data-min="25"><span class="chip-txt">25&nbsp;min</span></button>
          </div>
          <div class="timer-controls">
            <button class="pill pill-timer-main" id="btn-timer-stop" type="button" disabled>Iniciar</button>
            <button class="pill pill-timer-reset" id="btn-timer-reset" type="button" disabled>Reiniciar</button>
          </div>
      </div>
    </div>

      <div class="face" data-face="expanded-status">
        <div class="kicker">Agora</div>
        <div class="clock-big" id="clock-big">--:--</div>
        <div class="date-line" id="date-line"></div>
      </div>

      <div class="face" data-face="alert">
        <div class="alert-glyph">
          <svg class="g g-charge" viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M13 2 4.5 13.2h6.2L9.8 22 19.5 9.6h-6.2L13 2z"/></svg>
          <svg class="g g-low" viewBox="0 0 28 14" width="25" height="13"><rect x=".8" y=".8" width="22" height="12.4" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="24" y="4.2" width="2.4" height="5.6" rx="1" fill="currentColor"/><rect x="2.6" y="2.6" width="6" height="8.8" rx="1.4" fill="currentColor"/></svg>
          <svg class="g g-timer" viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="13.2" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13.2V9.2M9.6 3.2h4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg class="g g-notif" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3.2a6.2 6.2 0 0 0-6.2 6.2v3.1L4.2 15v1.4h15.6V15l-1.6-2.5V9.4A6.2 6.2 0 0 0 12 3.2zM9.6 18.2a2.4 2.4 0 0 0 4.8 0z"/></svg>
        </div>
        <div class="alert-copy">
          <div class="alert-title" id="alert-title"></div>
          <div class="alert-sub" id="alert-sub"></div>
        </div>
      </div>
      </div>
      <div class="blob-pager-footer">
        <div class="pager" id="pager">
          <button type="button" data-i="0" aria-label="Música"></button>
          <button type="button" data-i="1" aria-label="Bateria"></button>
          <button type="button" data-i="2" aria-label="Timer"></button>
          <button type="button" data-i="3" aria-label="Relógio"></button>
        </div>
      </div>
    </div>

    <div id="detached" class="blob">
      <div class="face on" data-face="timer-min">
        <span class="min-time" id="timer-min">0:00</span>
      </div>
    </div>
  </div>

  <script>
    // Apresentações da Dynamic Island: repouso, compacta, mínima, expandida e alerta.
    // Id diferente de "island" de propósito: window.island é a ponte do preload.
    const island = document.getElementById('ilha')
    const cluster = document.getElementById('cluster')
    const detached = document.getElementById('detached')
    const raiz = document.documentElement

    const music = { active: false, isPlaying: false, title: '', artist: '', art: '', progressMs: 0, durationMs: 0, stamp: 0 }
    const timer = { active: false, running: false, end: 0, remainOnPause: 0, total: 0, fired: false }
    let power = { available: false, percent: null, charging: false }
    let avisouFraca = false
    let alert = null
    let alertTimer = null
    let visual = ''
    let hotLeave = null
    let visitaTimer = null
    let ponteiroEmCima = false
    let pagina = 0
    const CHAVE_PAGINA = 'dynamic-island-pagina'
    let gestoX = null
    let playOtimista = null
    let syncPlayAte = 0
    let seekOtimistaAte = 0
    let arrastandoSeek = false
    let folhaSentido = 1
    let folhaEmCurso = false
    const PAGINAS = ['expanded-music', 'power', 'expanded-timer', 'expanded-status']

    const VOLTA_ANEL_SM = 2 * Math.PI * 9.5
    const VOLTA_ANEL_LG = 2 * Math.PI * 19

    // Cor do halo por contexto: a capa manda na música, o resto tem cor própria.
    const HALO = {
      neutro: '128 138 168',
      timer: '255 159 10',
      charge: '48 209 88',
      low: '255 69 58',
    }
    let haloDaCapa = HALO.neutro

    function ajustarHalo(mode, kind) {
      let cor = HALO.neutro
      if (kind && HALO[kind]) cor = HALO[kind]
      else if (mode === 'music-compact' || mode === 'minimal' || mode === 'expanded-music') cor = haloDaCapa
      else if (mode === 'timer-compact' || mode === 'expanded-timer') cor = HALO.timer
      else if (mode === 'charge' || mode === 'power') cor = power.charging ? HALO.charge : HALO.neutro
      else if (power.charging) cor = HALO.charge
      raiz.style.setProperty('--glow', cor)
    }

    function faceName(mode) {
      if (mode === 'minimal') return 'music-min'
      if (mode === 'alert-banner' || mode === 'alert-inline') return 'alert'
      return mode
    }

    function resolveMode() {
      if (!cluster.classList.contains('away')) return PAGINAS[pagina]
      if (alert) return alert.layout
      if (music.active && timer.active) return 'minimal'
      if (music.active) return 'music-compact'
      if (timer.active) return 'timer-compact'
      if (power.charging) return 'charge'
      return 'rest'
    }

    function renderLayout() {
      const mode = resolveMode()
      const kind = alert ? alert.kind : ''
      const key = mode + '/' + kind + '/' + (power.charging ? 'c' : 'o') + '/' + (power.available ? 'b' : 'n')
      ajustarHalo(mode, kind)
      if (key !== visual) {
        const mudouForma = visual !== ''
        visual = key
        island.className = 'blob ' + mode
          + (kind ? ' kind-' + kind : '')
          + (mode === 'expanded-status' && !power.available ? ' no-battery' : '')
        cluster.classList.toggle('minimal', mode === 'minimal')
        island.querySelectorAll('.face').forEach((face) => {
          face.classList.toggle('on', face.dataset.face === faceName(mode))
        })
        // Reinicia o squish para ele tocar em toda troca de forma.
        if (mudouForma) {
          island.classList.remove('morph')
          void island.offsetWidth
          island.classList.add('morph')
        }
        if (mode === 'expanded-music') medirTitulo()
        document.querySelectorAll('#pager button').forEach((botao, i) => {
          botao.classList.toggle('on', i === pagina)
        })
      }
      if (alert && (mode === 'alert-inline' || mode === 'alert-banner')) paintAlert()
    }

    function paintAlert() {
      document.getElementById('alert-title').textContent = alert.title || ''
      document.getElementById('alert-sub').textContent = alert.subtitle || ''
    }

    function salvarPagina() {
      try {
        localStorage.setItem(CHAVE_PAGINA, String(pagina))
      } catch (_) {}
    }

    function carregarPagina() {
      try {
        const salva = Number(localStorage.getItem(CHAVE_PAGINA))
        if (salva >= 0 && salva < PAGINAS.length) pagina = salva
      } catch (_) {}
    }

    function definirPagina(nova) {
      pagina = Math.max(0, Math.min(PAGINAS.length - 1, Number(nova) || 0))
      salvarPagina()
      renderLayout()
    }

    function mostrarIlha() {
      cluster.classList.remove('away')
    }

    function esconderIlha() {
      if (ponteiroEmCima) return
      if (alert && alert.sticky) return
      cluster.classList.add('away')
    }

    // Enquanto a pessoa usa o computador, a ilha desce devagar e volta a se esconder.
    function aparecerPorUmTempo(ms) {
      mostrarIlha()
      clearTimeout(visitaTimer)
      visitaTimer = setTimeout(esconderIlha, ms || 4000)
    }

    function pushAlert(next) {
      alert = next
      renderLayout()
      clearTimeout(alertTimer)
      if (next.ttl) alertTimer = setTimeout(dismissAlert, next.ttl)
      aparecerPorUmTempo(next.sticky ? 8000 : (next.ttl || 4000))
    }

    function dismissAlert() {
      alert = null
      clearTimeout(alertTimer)
      renderLayout()
    }

    function hora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    }

    function paintClock() {
      const t = hora()
      document.getElementById('clock').textContent = t
      document.getElementById('clock-big').textContent = t
      const data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })
      document.getElementById('date-line').textContent = data.charAt(0).toUpperCase() + data.slice(1)
    }

    function formatRemain(sec) {
      const s = Math.max(0, Math.floor(sec))
      const h = Math.floor(s / 3600)
      const m = Math.floor((s % 3600) / 60)
      const ss = s % 60
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0')
      return m + ':' + String(ss).padStart(2, '0')
    }

    function formatMs(ms) {
      return formatRemain(Math.max(0, Math.floor((ms || 0) / 1000)))
    }

    function timerLeft() {
      if (!timer.running) return timer.remainOnPause
      return Math.max(0, Math.ceil((timer.end - Date.now()) / 1000))
    }

    function pintarAnel(id, volta, fracao) {
      const el = document.getElementById(id)
      el.style.strokeDasharray = volta
      el.style.strokeDashoffset = volta * (1 - Math.max(0, Math.min(1, fracao)))
    }

    function paintTimer() {
      const left = timerLeft()
      const texto = formatRemain(left)
      document.getElementById('timer-compact').textContent = texto
      document.getElementById('timer-min').textContent = texto
      document.getElementById('timer-display').textContent = texto
      const parado = timer.active && !timer.running
      document.getElementById('timer-state').textContent = !timer.active
        ? 'Escolha um tempo'
        : (parado ? 'Parado' : 'Contando')
      const btnPrincipal = document.getElementById('btn-timer-stop')
      if (!timer.active) {
        btnPrincipal.textContent = 'Iniciar'
        btnPrincipal.disabled = true
        btnPrincipal.classList.add('is-idle')
      } else if (timer.running) {
        btnPrincipal.textContent = 'Parar'
        btnPrincipal.disabled = false
        btnPrincipal.classList.remove('is-idle')
      } else {
        btnPrincipal.textContent = 'Iniciar'
        btnPrincipal.disabled = false
        btnPrincipal.classList.add('is-idle')
      }
      document.getElementById('btn-timer-reset').disabled = !timer.active || !timer.total
      // Os anéis esvaziam conforme o tempo passa.
      const fracao = timer.total ? left / timer.total : 0
      pintarAnel('ring-sm', VOLTA_ANEL_SM, fracao)
      pintarAnel('ring-lg', VOLTA_ANEL_LG, fracao)
    }

    function finishTimer() {
      if (timer.fired) return
      timer.fired = true
      timer.active = false
      timer.running = false
      pushAlert({
        layout: 'alert-banner',
        kind: 'timer',
        title: 'Timer',
        subtitle: 'Tempo esgotado',
        sticky: true,
      })
      paintTimer()
      renderLayout()
    }

    function startIslandTimer(min) {
      const minutos = Math.max(1, Number(min) || 1)
      timer.active = true
      timer.running = true
      timer.fired = false
      timer.end = Date.now() + minutos * 60 * 1000
      timer.remainOnPause = minutos * 60
      timer.total = minutos * 60
      if (alert && alert.kind === 'timer') alert = null
      paintTimer()
      renderLayout()
      aparecerPorUmTempo(4500)
    }
    window.startIslandTimer = startIslandTimer

    function alternarTimerPrincipal() {
      if (!timer.active) return
      if (timer.running) {
        timer.remainOnPause = timerLeft()
        timer.running = false
      } else {
        timer.end = Date.now() + timer.remainOnPause * 1000
        timer.running = true
        timer.fired = false
      }
      paintTimer()
    }

    function resetTimer() {
      if (!timer.active || !timer.total) return
      timer.running = true
      timer.fired = false
      timer.remainOnPause = timer.total
      timer.end = Date.now() + timer.total * 1000
      if (alert && alert.kind === 'timer') dismissAlert()
      paintTimer()
    }

    // A cor viva da capa vira o halo da cápsula e o brilho dos detalhes.
    function atualizarAmbienteMusica() {
      island.classList.toggle('has-music-art', !!(music.active && music.art))
      island.classList.toggle('is-music-live', !!music.active)
      island.classList.toggle('is-playing', !!(music.active && music.isPlaying))
      const img = music.art ? 'url("' + music.art + '")' : ''
      const bg = document.getElementById('music-ambient-bg')
      const canvas = document.getElementById('music-ambient-canvas')
      const glance = document.getElementById('music-hero-glance')
      if (bg) bg.style.backgroundImage = img
      if (canvas) canvas.style.backgroundImage = img
      if (glance) glance.style.backgroundImage = img
    }

    function extrairCor(url) {
      const img = new Image()
      if (url && !String(url).startsWith('data:')) img.crossOrigin = 'anonymous'
      img.onload = () => {
        try {
          const lona = document.createElement('canvas')
          lona.width = 18
          lona.height = 18
          const ctx = lona.getContext('2d')
          ctx.drawImage(img, 0, 0, 18, 18)
          const px = ctx.getImageData(0, 0, 18, 18).data
          let r = 0, g = 0, b = 0, n = 0
          for (let i = 0; i < px.length; i += 4) {
            const maior = Math.max(px[i], px[i + 1], px[i + 2])
            const menor = Math.min(px[i], px[i + 1], px[i + 2])
            // Ignora pixels escuros ou acinzentados: o halo vem das cores fortes.
            if (maior < 46 || maior - menor < 20) continue
            r += px[i]; g += px[i + 1]; b += px[i + 2]; n++
          }
          if (!n) { r = 140; g = 140; b = 150; n = 1 }
          r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n)
          haloDaCapa = r + ' ' + g + ' ' + b
          ajustarHalo(resolveMode(), alert ? alert.kind : '')
          atualizarAmbienteMusica()
        } catch (erro) {
          haloDaCapa = HALO.neutro
        }
      }
      img.onerror = () => {
        haloDaCapa = HALO.neutro
        atualizarAmbienteMusica()
      }
      img.src = url
    }

    function applyArt(url) {
      document.querySelectorAll('[data-art]').forEach((el) => {
        if (!url) {
          el.style.backgroundImage = ''
          el.classList.remove('has-art')
          return
        }
        el.style.backgroundImage = 'url("' + url + '")'
        el.classList.add('has-art')
        el.classList.remove('pop')
        void el.offsetWidth
        el.classList.add('pop')
      })
      music.art = url || ''
      atualizarAmbienteMusica()
      if (url) extrairCor(url)
      else {
        haloDaCapa = HALO.neutro
        ajustarHalo(resolveMode(), alert ? alert.kind : '')
      }
    }

    // Título longo precisa saber quanto sobrou para fora antes de rolar.
    // A medida só vale depois que a cápsula terminou de crescer.
    function medirTitulo() {
      const caixa = document.getElementById('title-box')
      const texto = document.getElementById('song-title')
      if (caixa.clientWidth < 60) {
        caixa.classList.remove('roll')
        return
      }
      const sobra = texto.scrollWidth - caixa.clientWidth
      if (sobra > 6) {
        caixa.style.setProperty('--shift', '-' + sobra + 'px')
        caixa.classList.add('roll')
      } else {
        caixa.classList.remove('roll')
      }
    }
    new ResizeObserver(medirTitulo).observe(document.getElementById('title-box'))

    function estadoPlayDoServidor(data) {
      return !!(data && data.playing && data.isPlaying === true)
    }

    function aplicarEstadoPlay(doServidor) {
      const agora = Date.now()
      if (playOtimista !== null && agora < syncPlayAte) {
        music.isPlaying = playOtimista
        if (doServidor === playOtimista) {
          playOtimista = null
          syncPlayAte = 0
        }
        return
      }
      playOtimista = null
      syncPlayAte = 0
      music.isPlaying = doServidor
    }

    function musicaExpandidaVisivel() {
      return music.active && !cluster.classList.contains('away') && pagina === 0
    }

    function animarFolhaMusica(sentido, aoConcluir) {
      const meta = document.getElementById('music-meta')
      const wrap = document.querySelector('.music-meta-wrap')
      const glance = document.getElementById('music-hero-glance')
      if (!meta || !musicaExpandidaVisivel() || folhaEmCurso) {
        aoConcluir()
        return
      }
      folhaEmCurso = true
      island.classList.add('track-leafing')
      const fwd = sentido >= 0
      const dir = fwd ? 'leaf-fwd' : 'leaf-back'
      wrap?.classList.remove('leaf-fwd', 'leaf-back', 'leaf-active')
      wrap?.classList.add('leaf-active', dir)
      meta.classList.remove('leaf-in', 'leaf-out', 'leaf-fwd', 'leaf-back', 'leaf-run')
      meta.classList.add('leaf-out', dir)
      if (glance) glance.classList.add('leaf-glance')
      void meta.offsetWidth

      let meioPronto = false
      let folhaFechada = false
      const finalizar = () => {
        if (folhaFechada) return
        folhaFechada = true
        meta.classList.remove('leaf-in', 'leaf-fwd', 'leaf-back', 'leaf-run', 'leaf-out')
        wrap?.classList.remove('leaf-active', 'leaf-fwd', 'leaf-back')
        if (glance) glance.classList.remove('leaf-glance')
        island.classList.remove('track-leafing')
        folhaEmCurso = false
      }
      const entrar = () => {
        if (meioPronto) return
        meioPronto = true
        clearTimeout(fallbackSaida)
        aoConcluir()
        meta.classList.remove('leaf-out')
        meta.classList.add('leaf-in', dir)
        void meta.offsetWidth
        requestAnimationFrame(() => meta.classList.add('leaf-run'))
        const fallbackEntrada = setTimeout(finalizar, 680)
        meta.addEventListener('transitionend', function onIn(ev) {
          if (ev.target !== meta || ev.propertyName !== 'transform') return
          meta.removeEventListener('transitionend', onIn)
          clearTimeout(fallbackEntrada)
          finalizar()
        })
      }
      const fallbackSaida = setTimeout(entrar, 640)
      meta.addEventListener('transitionend', function onOut(ev) {
        if (ev.target !== meta || ev.propertyName !== 'transform') return
        meta.removeEventListener('transitionend', onOut)
        clearTimeout(fallbackSaida)
        entrar()
      })
    }

    function paintMusic() {
      document.getElementById('song-title').textContent = music.title || 'Música'
      document.getElementById('song-artist').textContent = music.artist || ''
      document.getElementById('eq').classList.toggle('paused', !music.isPlaying)
      document.getElementById('progress-bar').classList.toggle('is-playing', music.isPlaying)
      const btnPlay = document.getElementById('btn-play')
      btnPlay.querySelector('.ico-pause').classList.toggle('on', music.isPlaying)
      btnPlay.querySelector('.ico-play').classList.toggle('on', !music.isPlaying)
      btnPlay.setAttribute('aria-label', music.isPlaying ? 'Pausar' : 'Reproduzir')
      atualizarAmbienteMusica()
      medirTitulo()
    }

    function progressoAtualMs() {
      if (arrastandoSeek || Date.now() < seekOtimistaAte) return music.progressMs
      const decorrido = music.isPlaying ? Date.now() - music.stamp : 0
      const teto = music.durationMs || music.progressMs + decorrido
      return Math.min(music.progressMs + decorrido, teto)
    }

    function paintProgress() {
      const atual = progressoAtualMs()
      const pct = music.durationMs ? (atual / music.durationMs) * 100 : 0
      const pctClamped = Math.max(0, Math.min(100, pct))
      document.getElementById('progress').style.width = pctClamped + '%'
      const thumb = document.getElementById('progress-thumb')
      if (thumb) thumb.style.left = pctClamped + '%'
      document.getElementById('time-now').textContent = formatMs(atual)
      document.getElementById('time-left').textContent = music.durationMs ? formatMs(music.durationMs) : '–:–'
      const barra = document.getElementById('progress-bar')
      if (barra) barra.setAttribute('aria-valuenow', String(Math.round(pct)))
    }

    function msNaBarra(clientX) {
      const barra = document.getElementById('progress-bar')
      if (!barra || !music.durationMs) return 0
      const r = barra.getBoundingClientRect()
      const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width))
      return Math.round(ratio * music.durationMs)
    }

    function aplicarSeekVisual(ms) {
      music.progressMs = Math.max(0, Math.min(music.durationMs || ms, ms))
      music.stamp = Date.now()
      paintProgress()
    }

    function confirmarSeek(ms) {
      if (!music.active || !music.durationMs) return
      seekOtimistaAte = Date.now() + 2600
      aplicarSeekVisual(ms)
      window.island?.mediaSeek(ms)
    }

    function paintBattery() {
      const row = document.getElementById('battery-row')
      row.hidden = !power.available
      const fraca = power.available && !power.charging && power.percent <= 20
      row.classList.toggle('charging', !!power.charging)
      row.classList.toggle('low', fraca)
      const aceso = !!(power.available && power.charging)
      document.getElementById('battery-bolt').classList.toggle('on', aceso)
      document.getElementById('music-bolt').hidden = !aceso
      const pct = power.available && power.percent != null ? power.percent + '%' : ''
      document.getElementById('battery-label').textContent = pct
      document.getElementById('charge-pct').textContent = pct || '--'
      document.getElementById('power-pct').textContent = pct || '--'
      document.getElementById('power-kicker').textContent = 'Energia'
      const detalhe = document.getElementById('power-detail')
      if (!power.available) detalhe.textContent = 'Sem bateria'
      else if (power.charging) detalhe.textContent = 'Carregando'
      else if (fraca) detalhe.textContent = 'Bateria fraca'
      else detalhe.textContent = 'Na bateria'
      const anel = document.getElementById('ring-power')
      anel.style.stroke = power.charging ? '#30d158' : 'rgba(255,255,255,.85)'
      pintarAnel('ring-power', VOLTA_ANEL_LG, (power.percent || 0) / 100)
      // 21px é o espaço útil dentro do desenho da bateria.
      const nivel = power.available ? Math.max(2, (power.percent / 100) * 21) : 0
      document.getElementById('batt-level').style.width = nivel + 'px'
    }

    const barraProgresso = document.getElementById('progress-bar')
    function finalizarArrasteSeek(event) {
      if (!arrastandoSeek) return
      arrastandoSeek = false
      barraProgresso.classList.remove('seeking')
      if (barraProgresso.hasPointerCapture(event.pointerId)) {
        barraProgresso.releasePointerCapture(event.pointerId)
      }
      window.island?.segurar(false)
      confirmarSeek(msNaBarra(event.clientX))
    }
    barraProgresso.addEventListener('pointerdown', (event) => {
      event.stopPropagation()
      if (!music.active || !music.durationMs) return
      arrastandoSeek = true
      barraProgresso.classList.add('seeking')
      barraProgresso.setPointerCapture(event.pointerId)
      window.island?.segurar(true)
      aplicarSeekVisual(msNaBarra(event.clientX))
    })
    barraProgresso.addEventListener('pointermove', (event) => {
      if (!arrastandoSeek) return
      event.stopPropagation()
      aplicarSeekVisual(msNaBarra(event.clientX))
    })
    barraProgresso.addEventListener('pointerup', (event) => {
      event.stopPropagation()
      finalizarArrasteSeek(event)
    })
    barraProgresso.addEventListener('pointercancel', (event) => {
      event.stopPropagation()
      finalizarArrasteSeek(event)
    })

    island.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button, #progress-bar')) return
      gestoX = event.clientX
      window.island?.segurar(true)
    })
    window.addEventListener('pointerup', (event) => {
      window.island?.segurar(false)
      if (gestoX == null) return
      const dx = event.clientX - gestoX
      gestoX = null
      if (cluster.classList.contains('away') || Math.abs(dx) < 42) return
      definirPagina(dx < 0 ? pagina + 1 : pagina - 1)
    })
    document.querySelectorAll('#pager button').forEach((botao) => {
      botao.addEventListener('click', (event) => {
        event.stopPropagation()
        definirPagina(botao.dataset.i)
      })
    })
    detached.addEventListener('click', () => {
      definirPagina(2)
      aparecerPorUmTempo(4500)
    })

    document.getElementById('btn-prev').addEventListener('click', (event) => {
      event.stopPropagation()
      folhaSentido = -1
      if (musicaExpandidaVisivel() && !folhaEmCurso) animarFolhaMusica(-1, () => {})
      window.island?.mediaCommand('prev')
    })
    document.getElementById('btn-next').addEventListener('click', (event) => {
      event.stopPropagation()
      folhaSentido = 1
      if (musicaExpandidaVisivel() && !folhaEmCurso) animarFolhaMusica(1, () => {})
      window.island?.mediaCommand('next')
    })
    document.getElementById('btn-play').addEventListener('click', (event) => {
      event.stopPropagation()
      if (music.isPlaying) {
        const decorrido = Date.now() - music.stamp
        if (music.durationMs) music.progressMs = Math.min(music.durationMs, music.progressMs + decorrido)
        else music.progressMs += decorrido
      }
      const proximo = !music.isPlaying
      playOtimista = proximo
      syncPlayAte = Date.now() + 1800
      music.isPlaying = proximo
      music.stamp = Date.now()
      paintMusic()
      paintProgress()
      window.island?.mediaCommand('playpause')
    })
    document.getElementById('btn-timer-reset').addEventListener('click', (event) => {
      event.stopPropagation()
      resetTimer()
    })
    document.getElementById('btn-timer-stop').addEventListener('click', (event) => {
      event.stopPropagation()
      alternarTimerPrincipal()
    })
    document.querySelectorAll('#ilha .chip').forEach((chip) => {
      chip.addEventListener('click', (event) => {
        event.stopPropagation()
        startIslandTimer(chip.dataset.min)
      })
    })

    // Sair da cápsula equivale a tocar fora: a expandida recolhe.
    cluster.addEventListener('mouseleave', () => {
      clearTimeout(hotLeave)
      hotLeave = setTimeout(() => {
        if (alert && alert.sticky) return
        if (alert && !alert.sticky) {
          alert = null
          renderLayout()
        }
      }, 420)
    })
    cluster.addEventListener('mouseenter', () => clearTimeout(hotLeave))

    // Informa o retângulo real da cápsula. Fora dele o clique continua no Windows.
    function publicarHitbox() {
      const rects = []
      const borda = document.getElementById('borda').getBoundingClientRect()
      rects.push({ x: borda.left, y: 0, w: borda.width, h: 12 })
      document.querySelectorAll('.blob').forEach((blob) => {
        const r = blob.getBoundingClientRect()
        if (r.width < 4 || r.height < 4) return
        const topo = Math.max(0, r.top - 4)
        const baixo = r.bottom + 8
        if (baixo <= 0) return
        rects.push({ x: r.left - 6, y: topo, w: r.width + 12, h: baixo - topo })
      })
      window.island?.setHitbox(rects)
    }
    setInterval(publicarHitbox, 50)
    publicarHitbox()

    window.island?.onPointer((dentro) => {
      ponteiroEmCima = dentro
      if (dentro) {
        clearTimeout(hotLeave)
        clearTimeout(visitaTimer)
        mostrarIlha()
        renderLayout()
        return
      }
      clearTimeout(hotLeave)
      hotLeave = setTimeout(() => {
        if (alert && alert.sticky) return
        if (alert && !alert.sticky) alert = null
        esconderIlha()
        renderLayout()
      }, 550)
    })

    window.island?.onSpotifyUpdate((data) => {
      if (!data || !data.playing) {
        music.active = false
        music.isPlaying = false
        music.title = ''
        music.artist = ''
        music.art = ''
        music.progressMs = 0
        music.durationMs = 0
        playOtimista = null
        syncPlayAte = 0
        seekOtimistaAte = 0
        arrastandoSeek = false
        applyArt('')
        haloDaCapa = HALO.neutro
        atualizarAmbienteMusica()
        paintMusic()
        renderLayout()
        return
      }
      const entrou = !music.active
      music.active = true
      const tocando = estadoPlayDoServidor(data)
      const novoTitulo = data.title || 'Sem título'
      const novoArtista = data.artist || ''
      const faixaMudou = !!(music.title || music.artist)
        && (music.title !== novoTitulo || music.artist !== novoArtista)
      const animarFolha = faixaMudou && !entrou && !folhaEmCurso
      aplicarEstadoPlay(tocando)
      const servidorMs = data.progressMs || 0
      if (faixaMudou) {
        seekOtimistaAte = 0
        music.progressMs = servidorMs
        music.stamp = Date.now()
      } else if (playOtimista === null) {
        if (Date.now() < seekOtimistaAte) {
          const alvo = music.progressMs
          if (servidorMs + 3500 >= alvo || alvo < 4000) {
            music.progressMs = servidorMs
            music.stamp = Date.now()
            if (Math.abs(servidorMs - alvo) <= 1800) seekOtimistaAte = 0
          }
        } else {
          music.progressMs = servidorMs
          music.stamp = Date.now()
        }
      }
      music.durationMs = data.durationMs || 0

      function aplicarVisualFaixa() {
        music.title = novoTitulo
        music.artist = novoArtista
        if (data.art) {
          music.art = data.art
          applyArt(data.art)
        }
        paintMusic()
      }

      if (faixaMudou && folhaEmCurso) {
        aplicarVisualFaixa()
      } else if (animarFolha) {
        const sentido = folhaSentido
        animarFolhaMusica(sentido, () => {
          aplicarVisualFaixa()
          folhaSentido = 1
        })
      } else {
        aplicarVisualFaixa()
      }
      paintProgress()

      if (entrou) {
        definirPagina(0)
        aparecerPorUmTempo(4500)
      } else {
        renderLayout()
      }
    })

    window.island?.onPower((data) => {
      const antes = !!power.charging
      power = {
        available: !!(data && data.available),
        percent: data && data.percent != null ? data.percent : null,
        charging: !!(data && data.charging),
      }
      paintBattery()
      renderLayout()
      if (power.charging && !antes) aparecerPorUmTempo(5000)
      if (!power.available) return
      if (power.charging || power.percent > 20) avisouFraca = false
      else if (!avisouFraca) {
        avisouFraca = true
        pushAlert({
          layout: 'alert-inline',
          kind: 'low',
          title: 'Bateria fraca',
          subtitle: power.percent + '%',
          ttl: 3400,
        })
      }
    })

    setInterval(() => {
      paintClock()
      if (timer.active) {
        if (timer.running && timerLeft() <= 0) finishTimer()
        else paintTimer()
      }
      if (music.active) paintProgress()
    }, 100)

    carregarPagina()
    paintClock()
    paintTimer()
    renderLayout()

    window.showNotification = function (app, msg) {
      pushAlert({
        layout: 'alert-banner',
        kind: 'notif',
        title: app || 'Aviso',
        subtitle: msg || '',
        ttl: 4200,
      })
    }
    window.showMusic = function () {
      definirPagina(0)
      mostrarIlha()
    }
    window.showTimer = function () {
      definirPagina(2)
      aparecerPorUmTempo(4500)
    }
    window.showIdle = function () {
      dismissAlert()
      esconderIlha()
      renderLayout()
    }
  </script>
</body>
</html>
